name: Deploy Kitteltext

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Die Einzeldatei für Klinik-PCs ohne Zugriff auf die Adresse zusätzlich unter /kitteltext.html bereitstellen
      # (ANLEITUNG, Zehn-Minuten-Test). Fehlt sie, bricht der Lauf ab, statt eine halbe Seite auszuliefern.
      - run: cp dist-einzeldatei/kitteltext.html dist/kitteltext.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
